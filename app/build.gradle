plugins {
    id 'com.android.application'
}

// Release signing: keystore.properties (git-ignored) in the project root holds storeFile,
// storePassword, keyAlias and keyPassword. Without it, release builds stay unsigned.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'io.github.darthbob.kawanav'
    compileSdk 36

    defaultConfig {
        // calimoto build: its own app id, so it installs beside the original KawaNav (signed with another
        // key) instead of having to replace it
        applicationId 'io.github.darthbob.kawanav.calimoto'
        minSdk 33
        targetSdk 36
        versionCode 29
        versionName '1.2.8-calimoto'
    }

    // BuildConfig.DEBUG: the debug card (dash icon tests, phone name, Bluetooth service list) only in debug builds
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        // calimoto build: a fixed key for the debug APK, so every build (also the one GitHub Actions
        // makes) installs over the last one and keeps rides, settings and notification access
        calimotoDebug {
            storeFile file('debug-signing.p12')
            storePassword 'kawanav-calimoto'
            keyAlias 'kawanav-calimoto'
            keyPassword 'kawanav-calimoto'
            storeType 'pkcs12'
        }
        if (keystoreFile.exists()) {
            release {
                storeFile file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // with the release key where there is one (not in CI): the debug APK of a release then
            // installs over the normal one and back, keeping rides and settings
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.calimotoDebug
        }
        release {
            minifyEnabled false
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }
}

// Parser and recorder tests run on the JVM (app/src/test); the app itself has no dependencies.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
